<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau</title>
    <link rel="stylesheet" href="./tableau.css" />
  </head>
  <body>
    <main>
      <h1>Le cinéma "Paradis"</h1>
      <table>
        <caption>
          Programme du cinéma Paradis cette semaine
        </caption>
        <thead>
          <tr>
            <th scope="col">Film</th>
            <th scope="col">Durée</th>
            <th scope="col">Séance de l'après-midi</th>
            <th scope="col">Séance du soir</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Le Phare oublié</th>
            <td>1 h 52</td>
            <td>14 h 30</td>
            <td>20 h 45</td>
          </tr>
          <tr>
            <th scope="row">Mission Lune</th>
            <td>02 h 05</td>
            <td>15 h 00</td>
            <td>21 h 00</td>
          </tr>
          <tr>
            <th scope="row">Les Petits Pirates</th>
            <td>01 h 28</td>
            <td>14 h 00</td>
            <td>Pas de séance</td>
          </tr>
          <tr>
            <th scope="row">Retour à Lisbonne</th>
            <td>01 h 40</td>
            <td>16 h 15</td>
            <td>20 h 30</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
